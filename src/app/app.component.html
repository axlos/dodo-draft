<nb-layout>

  <nb-layout-header fixed>
    <nb-actions size="medium">
      <nb-action icon="message-square-outline" routerLink="/home" ></nb-action>
      <nb-action routerLink="/create-proposal">
        <span class="ml-2 create-new">Create New</span>
        <nb-icon icon="plus-outline" class="add-icon"></nb-icon>
      </nb-action>
      <nb-action routerLink="/history">
        <span>
          History
        </span>
      </nb-action>
      <nb-action routerLink="/profile">
        Profile
      </nb-action>
    </nb-actions>
    <nb-user name="Nikita Poltoratsky"
             title="full-stack developer"
             shape="round"
             nbContextMenuTag="my-context-menu"
             [nbContextMenu]="items"
    >
    </nb-user>
  </nb-layout-header>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

</nb-layout>
