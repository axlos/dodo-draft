<nb-layout>

  <nb-layout-header fixed>
    <nb-actions size="medium">
      <nb-action icon="message-square-outline" routerLink="/home"></nb-action>
      <nb-action [routerLink]="item.router"
                 (click)="onAction(item)"
                 *ngFor="let item of headerMenu$ | async">
        <span [class]="item.class">
          {{item.title}}
        </span>
        <nb-icon icon="plus-outline" [class]="item.icon" *ngIf="item.icon">
        </nb-icon>
      </nb-action>
    </nb-actions>
    <nb-user name="Nikita Poltoratsky"
             title="full-stack developer"
             shape="round"
             nbContextMenuTag="my-context-menu"
             [nbContextMenu]="items"
    >
    </nb-user>
  </nb-layout-header>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

</nb-layout>
