<nb-layout>

  <nb-layout-header fixed>
    <nb-actions size="medium">
      <nb-action icon="home-outline" routerLink="/home"></nb-action>
      <nb-action routerLink="/proposal">
        <span class="ml-2 create-new">Create New</span>
        <nb-icon icon="plus-outline" class="add-icon"></nb-icon>
      </nb-action>
      <nb-action routerLink="/history">
        <span>
          History
        </span>
      </nb-action>
      <nb-action routerLink="/profile">
        Profile
      </nb-action>
    </nb-actions>
    <nb-user name="Nikita Poltoratsky"
             title="full-stack developer"
             badgeText="2"
             shape="rectangle"
             badgeStatus="success"
             badgePosition="bottom right"
             nbContextMenuTag="my-context-menu"
             [nbContextMenu]="items"
    >
    </nb-user>
  </nb-layout-header>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

</nb-layout>
