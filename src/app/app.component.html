<nb-layout>

  <nb-layout-header fixed>
    <nb-actions size="medium" class="">
      <nb-action icon="message-square-outline" routerLink="/home"></nb-action>
      <nb-action [routerLink]="item.router"
                 (click)="onAction(item)"
                 *ngFor="let item of headerMenu$ | async">
        <span [class]="item.class">
          {{item.title}}
        </span>
        <nb-icon class="action-icon" [icon]="item.icon" *ngIf="item.icon">
        </nb-icon>
      </nb-action>
      <nb-action class="push-to-right"
                 (click)="login()"
                 *ngIf="!(isAuthenticated$ | async)">
        <span>
          Log in
        </span>
      </nb-action>
      <nb-action class="push-to-right"
                 *ngIf="isAuthenticated$ | async">
        <app-user-menu [user]="user$ | async"></app-user-menu>
      </nb-action>
    </nb-actions>
  </nb-layout-header>

  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

</nb-layout>
