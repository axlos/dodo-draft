<div class="d-flex column" *ngIf="!editing && !deleting">
  <button nbButton ghost
          type="button"
          status="primary"
          shape="semi-round"
          class="me-1"
          [size]="size"
          [disabled]="loading"
          (click)="onEdit()"
          *ngIf="config.edit">
    <nb-icon icon="edit-outline"></nb-icon>
  </button>
  <button nbButton ghost
          type="button"
          status="primary"
          shape="semi-round"
          [size]="size"
          [disabled]="loading"
          (click)="onDelete()"
          *ngIf="config.delete">
    <nb-icon icon="trash-outline"></nb-icon>
  </button>
</div>

<div class="d-flex column" *ngIf="editing || deleting">
  <button nbButton ghost
          type="button"
          status="success"
          shape="semi-round"
          class="me-1"
          [size]="size"
          [disabled]="loading"
          (click)="onConfirm()">
    <nb-icon icon="checkmark-outline"></nb-icon>
  </button>
  <button nbButton ghost
          type="button"
          status="primary"
          shape="semi-round"
          [size]="size"
          [disabled]="loading"
          (click)="onCancel()">
    <nb-icon icon="close-outline"></nb-icon>
  </button>
</div>
