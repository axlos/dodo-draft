<nb-card>
  <nb-card-body class="m-4">
    <form>
      <div class="mb-4">
        <label for="title">Job title</label>
        <input id="title" type="text" nbInput fullWidth fieldSize="large" disabled>
      </div>
      <div class="mb-4">
        <label for="description" class="form-label">
          Job description
        </label>
        <textarea id="description" nbInput fullWidth fieldSize="large" rows="5" disabled>
        </textarea>
      </div>
      <div class="mb-4">
        <label for="question" class="form-label">
          Relevant Question <span class="text-muted">(Optional)</span>
        </label>
        <input id="question" nbInput fullWidth fieldSize="large"/>
        <div id="emailHelp" class="form-text">
          Asking a question about the project can demonstrate your commitment to it and may help you stand out among other proposals
        </div>
      </div>
      <div class="mb-4">
        <div class="d-flex flex-column">
          <nb-toggle status="basic" class="mb-2">
            Include job experiences
          </nb-toggle>
          <nb-toggle status="basic" class="mb-2">
            Include educations
          </nb-toggle>
          <nb-toggle status="basic" class="mb-2">
            Include certifications
          </nb-toggle>
          <nb-toggle status="basic" class="mb-2">
            Include languages
          </nb-toggle>
        </div>
      </div>
      <div>
        <button nbButton size="large" status="basic">Re-Generate</button>
      </div>
    </form>
  </nb-card-body>
</nb-card>
