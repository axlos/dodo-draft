<!-- Testimonials -->
<div class="mt-5 mb-5 final-step">
  <h2 class="display-5 fw-bold">
    {{'home.testimonials.title' | translate}}
  </h2>
  <p class="lead mb-4 lh-sm">
    {{'home.testimonials.description' | translate}}
  </p>
  <div class="pt-4">
    <div class="testimonials" appLazyLoad>
      <nb-card
        class="testimonial col-sm-12"
        *ngFor="let testimonial of testimonials"
      >
        <nb-card-header>
          <img class="mt-2 mb-2"
            [src]="testimonial.photo"
            alt="Photo of {{ testimonial.name }}"
          />
          <span class="testimonial__name">{{ testimonial.name }}</span>
          <span class="testimonial__role">{{ testimonial.role }}</span>
        </nb-card-header>
        <nb-card-body>
          <p>{{ testimonial.text }}</p>
        </nb-card-body>
      </nb-card>
    </div>
  </div>
</div>
