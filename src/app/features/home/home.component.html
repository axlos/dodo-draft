<div class="intro">
  <div class="background-video">
    <video class="video" autoplay muted loop>
      <source src="/assets/video/hero-video-4.mp4" type="video/mp4" />
    </video>
    <div class="linear-gradient">
    </div>
  </div>

  <div class="content-hero pt-5 mt-sm-4 mt-4 mt-sm-0">
    <h1 class="display-1 fw-bold text-center text-basic-color mb-5">
      {{'home.title' | translate}}
    </h1>

    <h3 class="text-center text-basic-color pt-2 hero-subtitle">
      {{'home.use-power-ai' | translate}}
      <span class="fw-bold highlight-word">{{'home.resumes' | translate}}</span>
      <span class="ms-1 me-1">{{'home.and' | translate}}</span>
      <span class="fw-bold highlight-word me-1">{{'home.cover-letters' | translate}}</span>
      <span>{{'home.dream-job' | translate}}</span>
    </h3>

    <div class="pt-4">
      <app-call-to-action-button></app-call-to-action-button>
    </div>
  </div>
</div>

<app-features-supported id="how-it-works"></app-features-supported>
<app-testimonials></app-testimonials>
<app-final-cta></app-final-cta>
