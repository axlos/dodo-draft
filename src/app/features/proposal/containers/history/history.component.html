<nb-layout>
  <nb-layout-column class="p-0">
    <h2>
      History
    </h2>
    <p class="pb-4 lead">
      Your personal archive of crafted professional proposals
    </p>

    <div class="mb-2" *ngFor="let jobHistory of (jobs$ | async) ?? []">
      <app-proposal-history [jobHistory]="jobHistory"
                            [loading]="(loading$ | async) ?? false"
                            (delete)="delete($event)">
      </app-proposal-history>
    </div>
    <div class="mt-4" role="alert" *ngIf="(jobs$ | async)?.length === 0">
      There is no history. click <a class="alert-link" (click)="create()">here</a> to create a new proposal.
    </div>
  </nb-layout-column>
</nb-layout>
