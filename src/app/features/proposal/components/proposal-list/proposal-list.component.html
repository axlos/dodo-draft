<div *ngIf="job !== null">
  <div class="proposal" *ngIf="saving">
    <app-proposal-ai [proposal]="fakeProposal"
                     [loading]="true">
    </app-proposal-ai>
  </div>
  <div class="proposal" *ngFor="let proposal of job.proposals">
    <app-proposal-ai [proposal]="proposal"
                     [loading]="loading"
                     (delete)="delete.emit({ job: job, proposal: $event })">
    </app-proposal-ai>
  </div>
  <p *ngIf="job.proposals.length === 0 && !loading && !saving">
    {{'proposal.list.create' | translate}}
  </p>
</div>
