<nb-card *ngIf="job !== null" accent="basic">
  <nb-card-body class="m-4">
    <h5>
      Proposals <span *ngIf="!loading">({{job.proposals.length}})</span>
    </h5>
    <div class="proposal" *ngIf="saving">
      <app-proposal-ai [proposal]="fakeProposal"
                       [loading]="true">
      </app-proposal-ai>
    </div>
    <div class="proposal" *ngFor="let proposal of job.proposals">
      <app-proposal-ai [proposal]="proposal"
                       [loading]="loading">
      </app-proposal-ai>
    </div>
  </nb-card-body>
</nb-card>
