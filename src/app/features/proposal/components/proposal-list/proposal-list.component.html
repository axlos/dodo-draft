<nb-card *ngIf="job !== null">
  <nb-card-body class="m-4">
    <h6 class="mb-4">
      {{job.title}}
    </h6>
    <div class="proposal" *ngFor="let proposal of job.proposals | sort:'updatedAt'">
      <app-proposal-ai [proposal]="proposal"
                       [loading]="loading">
      </app-proposal-ai>
    </div>
  </nb-card-body>
</nb-card>
