<nb-card>
  <nb-card-header>
    <div class="d-flex align-items-center">
      <span [ngClass]="{ 'col-4': loading, 'placeholder': loading, 'placeholder-lg': loading }">
        {{jobHistory.job.title}}
      </span>
      <div class="d-flex flex-row ms-2 ms-auto" aria-hidden="true" *ngIf="breakpoints === 'md'">
        <button nbButton ghost
                type="button"
                status="primary"
                size="small"
                shape="semi-round"
                class="me-1"
                [disabled]="loading || jobHistory.removing"
                [routerLink]="['/proposal', jobHistory.job._id]">
          <nb-icon icon="edit-outline"></nb-icon>
        </button>
        <app-crud-buttons [loading]="loading || jobHistory.removing"
                          [config]="crudConfig"
                          (delete)="onDelete()">
        </app-crud-buttons>
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    <p class="lh-base job-description"
       [ngClass]="{ 'col-12': loading, 'placeholder': loading }">
      {{jobHistory.job.details}}
    </p>
  </nb-card-body>
  <nb-card-footer *ngIf="breakpoints === 'sm'">
    <div class="d-flex flex-row justify-content-end" aria-hidden="true">
      <button nbButton ghost
              type="button"
              status="primary"
              size="small"
              shape="semi-round"
              class="me-1"
              [disabled]="loading || jobHistory.removing"
              [routerLink]="['/proposal', jobHistory.job._id]">
        <nb-icon icon="edit-outline"></nb-icon>
      </button>
      <app-crud-buttons [loading]="loading || jobHistory.removing"
                        [config]="crudConfig"
                        (delete)="onDelete()">
      </app-crud-buttons>
    </div>
  </nb-card-footer>
</nb-card>
