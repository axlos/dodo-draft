<form (ngSubmit)="createProposal()"
      [formGroup]="proposalForm">
  <div class="mb-2">
    <input nbInput fullWidth
           id="title"
           type="text"
           placeholder="Job title"
           fieldSize="large"
           formControlName="title">
  </div>
  <div class="mb-2">
    <textarea nbInput fullWidth
              placeholder="Job details"
              id="description"
              fieldSize="large"
              rows="6"
              formControlName="details">
    </textarea>
  </div>
  <div class="d-flex flex-column mb-2">
    <textarea nbInput fullWidth
              id="question"
              fieldSize="large"
              placeholder="Specific question"
              rows="2"
              formControlName="question"></textarea>
    <div class="d-flex flex-row align-items-center">
      <div class="form-text me-1">
        Add a relevant question <span class="text-muted">(Optional)</span>
      </div>
      <button nbButton ghost
              status="info"
              size="small"
              shape="round"
              type="button"
              [nbPopover]="infoQuestionRef"
              nbPopoverPlacement="bottom">
        <nb-icon icon="question-mark-circle-outline"></nb-icon>
      </button>
      <ng-template #infoQuestionRef>
        <small class="wrapper-popover">
          Asking a question about the project can demonstrate your commitment to it and may help you stand out among other proposals
        </small>
      </ng-template>
    </div>
  </div>
  <div class="mb-2">
    <label for="description" class="form-label">
      Talk about
    </label>
    <div class="d-flex flex-column">
      <nb-toggle status="basic"
                 class="mb-2"
                 formControlName="experiences"
                 *ngIf="profile?.experiences.length > 0">
        Experiences
      </nb-toggle>
      <nb-toggle status="basic"
                 class="mb-2"
                 formControlName="educations"
                 *ngIf="profile?.educations.length > 0">
        Educations
      </nb-toggle>
      <nb-toggle status="basic"
                 class="mb-2"
                 formControlName="certifications"
                 *ngIf="profile?.certifications.length > 0">
        Certifications
      </nb-toggle>
      <nb-toggle status="basic"
                 class="mb-2"
                 formControlName="languages"
                 *ngIf="profile?.languages.length > 0">
        Languages
      </nb-toggle>
    </div>
  </div>
  <div class="pt-2 d-flex justify-content-between">
    <button nbButton
            size="large"
            status="primary"
            type="submit"
            [disabled]="proposalForm.invalid || loading">
      Generate
    </button>
    <div class="d-flex flex-row align-items-center">
      <button nbButton size="large" status="basic" class="position-relative" type="button">
        <span>
          Buy Credits
        </span>
        <span class="position-absolute top-0 start-100 translate-middle badge su">
          4
        </span>
      </button>
    </div>
  </div>
</form>
