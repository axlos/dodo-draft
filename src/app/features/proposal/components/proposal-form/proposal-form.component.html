<form (ngSubmit)="createProposal()"
      [formGroup]="proposalForm">
  <div class="mb-3">
    <label for="title">Job title</label>
    <input nbInput fullWidth
           id="title"
           type="text"
           fieldSize="large"
           formControlName="title">
  </div>
  <div class="mb-2">
    <label for="description" class="form-label">
      Job details
    </label>
    <textarea nbInput fullWidth
              id="description"
              fieldSize="large"
              rows="6"
              formControlName="details">
    </textarea>
  </div>
  <div class="d-flex flex-column mb-3">
    <div class="d-flex flex-row align-items-center">
      <label for="additionalContent" class="form-label mb-0">
        Add a relevant content <span class="text-muted">(Optional)</span>
      </label>
      <button nbButton ghost
              status="info"
              size="small"
              shape="round"
              type="button"
              [nbPopover]="infoQuestionRef"
              nbPopoverPlacement="bottom">
        <nb-icon icon="question-mark-circle-outline"></nb-icon>
      </button>
    </div>
    <ng-template #infoQuestionRef>
      <small class="wrapper-popover">
        Feel free to ask questions about the project and show your unique strengths for this job. Write in your own words even in your native language, and we'll make your content better to help it stand out.
      </small>
    </ng-template>
    <textarea nbInput fullWidth
              id="additionalContent"
              fieldSize="large"
              rows="2"
              formControlName="additionalContent"></textarea>
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">
      Talk about
    </label>
    <div class="d-flex flex-row">
      <div class="col-6">
        <nb-toggle status="basic"
                   class="mb-2"
                   formControlName="experiences">
          Experiences
        </nb-toggle>
        <nb-toggle status="basic"
                   class="mb-2"
                   formControlName="certifications">
          Certifications
        </nb-toggle>
      </div>
      <div class="col-6">
        <nb-toggle status="basic"
                   class="mb-2"
                   formControlName="educations">
          Educations
        </nb-toggle>
        <nb-toggle status="basic"
                   class="mb-2"
                   formControlName="languages">
          Languages
        </nb-toggle>
      </div>
    </div>
  </div>
  <div class="pt-2 d-flex justify-content-between">
    <button nbButton
            size="large"
            status="primary"
            type="submit"
            [disabled]="proposalForm.invalid || loading">
      Generate
    </button>
    <div class="d-flex flex-row align-items-center">
      <button nbButton size="large" status="basic" class="position-relative" type="button">
        <span>
          Buy Credits
        </span>
        <span class="position-absolute top-0 start-100 translate-middle badge su">
          4
        </span>
      </button>
    </div>
  </div>
</form>
