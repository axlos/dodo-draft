<nb-card>
  <nb-card-body class="m-4">
    <form>
      <div class="mb-4">
        <label for="title">Job title</label>
        <input id="title" type="text" nbInput fullWidth fieldSize="large" disabled>
      </div>
      <div class="mb-4">
        <label for="description" class="form-label">
          Job description
        </label>
        <textarea id="description" nbInput fullWidth fieldSize="large" rows="5" disabled>
        </textarea>
      </div>
      <div class="mb-4">
        <label for="question" class="form-label">
          Relevant Question <span class="text-muted">(Optional)</span>
        </label>
        <input id="question" nbInput fullWidth fieldSize="large"/>
        <div id="emailHelp" class="form-text">
          Asking a question about the project can demonstrate your commitment to it and may help you stand out among
          other proposals
        </div>
      </div>
      <div class="mb-4">
        <label for="description" class="form-label">
          Talk about
        </label>
        <div class="d-flex flex-row">
          <nb-toggle status="basic" class="me-4">
            Job experiences
          </nb-toggle>
          <nb-toggle status="basic" class="me-4">
            Educations
          </nb-toggle>
          <nb-toggle status="basic" class="me-4">
            Certifications
          </nb-toggle>
          <nb-toggle status="basic" class="me-4">
            Languages
          </nb-toggle>
        </div>
      </div>
      <div class="pt-2 d-flex justify-content-between">
        <button nbButton size="large" status="primary">
          Generate
        </button>
        <div class="d-flex flex-row align-items-center">
          <button nbButton size="large" status="basic" class="position-relative">
            <span>
              Buy Credits
            </span>
            <span class="position-absolute top-0 start-100 translate-middle badge su">
              4
            </span>
          </button>
        </div>
      </div>
    </form>
  </nb-card-body>
</nb-card>
