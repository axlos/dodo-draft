<form (ngSubmit)="save()"
      [formGroup]="formEducation">
  <nb-card>
    <nb-card-header>
      <h6>
        {{'profile.profile-form.education-section.title' | translate}}
      </h6>
    </nb-card-header>
    <nb-card-body>
      <div class="row g-2">
        <div class="col-md-6 col-sm-12">
          <label for="degree" class="label">
            {{'profile.profile-form.education-section.degree' | translate}}
          </label>
          <input nbInput fullWidth
                 id="degree"
                 type="text"
                 fieldSize="large"
                 maxlength="100"
                 formControlName="degree">
        </div>
        <div class="col-md-6 col-sm-12">
          <label for="institution" class="label">
            {{'profile.profile-form.education-section.institution' | translate}}
          </label>
          <input nbInput fullWidth
                 id="institution"
                 type="text"
                 fieldSize="large"
                 maxlength="100"
                 formControlName="institution">
        </div>
      </div>
    </nb-card-body>
    <nb-card-footer>
      <div class="d-flex justify-content-end">
        <button nbButton
                type="button"
                status="basic"
                class="me-2"
                (click)="cancel()">
          {{'profile.profile-form.cancel' | translate}}
        </button>
        <button nbButton
                status="primary"
                type="submit"
                [disabled]="formEducation.invalid">
          {{'profile.profile-form.save' | translate}}
        </button>
      </div>
    </nb-card-footer>
  </nb-card>
</form>
