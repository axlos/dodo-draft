<form (ngSubmit)="save()"
      [formGroup]="formExperience">
  <nb-card>
    <nb-card-header>
      <h6>
        {{'profile.profile-form.experience-section.title' | translate}}
      </h6>
    </nb-card-header>
    <nb-card-body>
      <div class="row g-2">
        <div class="col-md-6 col-sm-12">
          <label for="company" class="label">
            {{'profile.profile-form.experience-section.company' | translate}}
          </label>
          <input nbInput fullWidth
                 id="company"
                 type="text"
                 fieldSize="large"
                 maxlength="100"
                 formControlName="company">
        </div>
        <div class="col-md-6 col-sm-12">
          <label for="position" class="label">
            {{'profile.profile-form.experience-section.position' | translate}}
          </label>
          <input nbInput fullWidth
                 id="position"
                 type="text"
                 fieldSize="large"
                 maxlength="100"
                 formControlName="position">
        </div>
        <div class="col-sm-12">
          <label for="description" class="label">
            {{'profile.profile-form.experience-section.description' | translate}}
          </label>
          <textarea nbInput fullWidth
                    id="description"
                    rows="4"
                    fieldSize="large"
                    maxlength="1000"
                    formControlName="description"></textarea>
        </div>
      </div>
    </nb-card-body>
    <nb-card-footer>
      <div class="d-flex justify-content-end">
        <button nbButton
                type="button"
                status="basic"
                class="me-2"
                (click)="cancel()">
          {{'profile.profile-form.cancel' | translate}}
        </button>
        <button nbButton
                status="primary"
                type="submit"
                [disabled]="formExperience.invalid">
          {{'profile.profile-form.save' | translate}}
        </button>
      </div>
    </nb-card-footer>
  </nb-card>
</form>
